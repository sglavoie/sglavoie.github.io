# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: check-site
        name: build the site and check links and SEO
        entry: scripts/check-site.sh
        language: script
        pass_filenames: false
        files: ^(content|layouts|assets|static|archetypes|hugo\.toml)
