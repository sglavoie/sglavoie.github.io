<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
  <head>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.dataset.theme = theme;
          }
        } catch (e) {}
      })();
    </script>
    {{ partial "head.html" . }}
    {{ block "head" . }}{{ end }}
    <title>{{ .Site.Title }}{{ block "title" . }}{{ end }}</title>
  </head>

  <body>
    {{ partial "header.html" . }}

    <main>
      {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}

    <dialog id="search-dialog" class="search-dialog" aria-labelledby="search-dialog-title">
      <div class="search-dialog__header">
        <h2 id="search-dialog-title" class="search-dialog__title">Search</h2>
        <button type="button" class="search-dialog__close" data-close-search aria-label="Close search">
          <kbd>Esc</kbd>
        </button>
      </div>
      <div id="search" class="search-dialog__body"></div>
    </dialog>

    <script src="{{ "/pagefind/pagefind-ui.js" | relURL }}"></script>
    <script>
      const searchTrigger = document.getElementById("search-trigger");
      const searchDialog = document.getElementById("search-dialog");
      let pagefindUI = null;

      function focusSearchInput() {
        const searchInput = searchDialog.querySelector("input");
        if (searchInput) {
          searchInput.focus();
          searchInput.select();
        }
      }

      function isEditableTarget(target) {
        return Boolean(
          target &&
            target.closest(
              'input, textarea, select, button, [contenteditable="true"]',
            ),
        );
      }

      function openSearchModal() {
        if (searchDialog.open || typeof PagefindUI === "undefined") {
          return;
        }
        if (!pagefindUI) {
          pagefindUI = new PagefindUI({
            element: "#search",
            showSubResults: true,
            showImages: false,
            debounceTimeoutMs: 100,
          });
        }
        searchDialog.showModal();
        searchTrigger?.setAttribute("aria-expanded", "true");
        // Pagefind renders its input asynchronously on first open.
        requestAnimationFrame(focusSearchInput);
      }

      searchDialog.addEventListener("close", function () {
        searchTrigger?.setAttribute("aria-expanded", "false");
      });

      searchDialog.addEventListener("click", function (e) {
        // Clicks on the backdrop target the dialog element itself.
        if (e.target === searchDialog || e.target.closest("[data-close-search]")) {
          searchDialog.close();
        }
        if (e.target.closest(".pagefind-ui__search-clear")) {
          focusSearchInput();
        }
      });

      if (searchTrigger) {
        searchTrigger.setAttribute("aria-expanded", "false");
        searchTrigger.addEventListener("click", openSearchModal);
      }

      const themeToggle = document.getElementById("theme-toggle");

      function systemTheme() {
        return window.matchMedia("(prefers-color-scheme: light)").matches
          ? "light"
          : "dark";
      }

      function currentTheme() {
        return document.documentElement.dataset.theme || systemTheme();
      }

      const themeColors = { dark: "#090f15", light: "#fcfdfe" };

      // With an explicit theme, both theme-color tags use its colour; otherwise
      // each tag goes back to the colour matching its own media query.
      function syncThemeColor() {
        const explicit = document.documentElement.dataset.theme;
        document
          .querySelectorAll('meta[name="theme-color"]')
          .forEach(function (meta) {
            const own = (meta.getAttribute("media") || "").includes("light")
              ? "light"
              : "dark";
            meta.setAttribute("content", themeColors[explicit || own]);
          });
      }

      syncThemeColor();

      if (themeToggle) {
        themeToggle.addEventListener("click", function () {
          const next = currentTheme() === "dark" ? "light" : "dark";
          // Landing on the system theme drops the override, so the site
          // follows the system appearance again.
          const followSystem = next === systemTheme();
          if (followSystem) {
            delete document.documentElement.dataset.theme;
          } else {
            document.documentElement.dataset.theme = next;
          }
          syncThemeColor();
          try {
            if (followSystem) {
              localStorage.removeItem("theme");
            } else {
              localStorage.setItem("theme", next);
            }
          } catch (e) {}
        });
      }

      // On small screens the nav row scrolls sideways; mark which ends have
      // links out of view so the CSS can fade them as a hint.
      const siteNav = document.querySelector(".site-nav");
      const siteNavList = siteNav?.querySelector(".site-nav__list");
      if (siteNavList) {
        function syncNavFades() {
          const max = siteNavList.scrollWidth - siteNavList.clientWidth;
          const more = [];
          if (siteNavList.scrollLeft > 1) more.push("start");
          if (siteNavList.scrollLeft < max - 1) more.push("end");
          siteNav.dataset.more = more.join(" ");
        }
        siteNavList.addEventListener("scroll", syncNavFades, { passive: true });
        window.addEventListener("resize", syncNavFades);
        syncNavFades();
      }

      // Copy buttons on code blocks (see render-codeblock.html).
      if (navigator.clipboard) {
        document.querySelectorAll(".code-block__copy").forEach(function (button) {
          button.hidden = false;
          button.addEventListener("click", function () {
            // With line numbers, Chroma renders a table; the code is the last <code>.
            const codes = button.closest(".code-block").querySelectorAll("pre code");
            const code = codes[codes.length - 1];
            navigator.clipboard.writeText(code.innerText.replace(/\n$/, "")).then(function () {
              button.textContent = "Copied";
              button.dataset.copied = "";
              window.setTimeout(function () {
                button.textContent = "Copy";
                delete button.dataset.copied;
              }, 1600);
            });
          });
        });
      }

      // Key press event for the 'F' key
      document.addEventListener("keydown", function (e) {
        if (
          e.key.toLowerCase() === "f" &&
          !searchDialog.open &&
          !e.metaKey &&
          !e.ctrlKey &&
          !e.altKey &&
          !isEditableTarget(e.target)
        ) {
          e.preventDefault();
          openSearchModal();
        }
      });
    </script>
  </body>
</html>
