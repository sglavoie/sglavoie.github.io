<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
  <head>
    {{ partial "head.html" . }}
    {{ block "head" . }}{{ end }}
    <title>{{ .Site.Title }}{{ block "title" . }}{{ end }}</title>
  </head>

  <body>
    <div id="pageContainer">
      <span title="Press F to search">
        {{ partial "icons/search.html" . }}
      </span>
      {{ partial "sidebar.html" . }}
      {{ partial "nav.html" . }}

      <!-- Content area -->
      <main>
        {{ block "main" . }}{{ end }}
      </main>
    </div>

    {{ partial "footer.html" . }}

    <script src="{{ "/pagefind/pagefind-ui.js" | relURL }}"></script>
    <script src="{{ "/theme/scripts/sweetalert2.min.js" | relURL }}"></script>
    <script>
      function openSearchModal() {
        Swal.fire({
          title: "<strong>Search</strong>",
          html: `
    <div id="searchWrapper">
      <div id="search"></div>
    </div>`,
          showCancelButton: false,
          focusConfirm: false,
          didOpen: () => {
            new PagefindUI({
              element: "#search",
              showSubResults: true,
              showImages: false,
              debounceTimeoutMs: 100,
            });
            document
              .getElementById("search")
              .getElementsByTagName("input")[0]
              .focus();

            // Re-focus on search input when clear button is clicked
            document
              .getElementsByClassName("pagefind-ui__search-clear")[0]
              .addEventListener("click", function () {
                document
                  .getElementById("search")
                  .getElementsByTagName("input")[0]
                  .focus();
              });
          },
          width: "100%",
          confirmButtonText: "Close",
          position: "top-start",
        });
      }

      document
        .getElementById("search-icon")
        .addEventListener("click", function () {
          openSearchModal();
        });

      // Key press event for the 'F' key
      document.addEventListener("keydown", function (e) {
        // Check if modal is not already focused/open
        if (e.key === "F" && !Swal.isVisible()) {
          openSearchModal();
        }
      });
    </script>
  </body>
</html>
