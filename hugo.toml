# HUGO_VERSION=0.158.0 (extended) — must match Cloudflare Pages build env

baseURL = "https://www.sglavoie.com/"
locale = "en-US"
title = "sglavoie.com"
defaultContentLanguage = "en"
timeZone = "America/Mexico_City"
enableRobotsTXT = false

[pagination]
  pagerSize = 5

[params]
author = "Sébastien Lavoie"
intro = "Hi, I'm Sébastien — a software developer writing about Go, software design, and the tools and workflows that make programming more enjoyable."
# Closes every post, above the RSS link.
signoff = "Thanks for reading! I'm Sébastien, a software developer writing about Go, software design, and the tools that make programming more enjoyable. New posts show up in the RSS feed."
description = "Posts and writings by Sébastien Lavoie. Customization setups and articles on productivity for developers who like minimalism."

# Shown under the home intro.
[[params.intro_links]]
  name = "GitHub"
  url = "https://github.com/sglavoie"
[[params.intro_links]]
  name = "LinkedIn"
  url = "https://www.linkedin.com/in/sglavoie/"
[[params.intro_links]]
  name = "Resume"
  url = "/resume/"
[[params.intro_links]]
  name = "RSS feed"
  url = "/feeds/sglavoie.rss.xml"

[permalinks]
  posts = "/posts/:slug/"

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser.attribute]
    block = false
    title = false
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[services.rss]
  limit = -1

[outputFormats.RSS]
  baseName = "sglavoie.rss"
  path = "feeds"
  mediaType = "application/rss+xml"
