<article>
  <div>
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  </div>
  {{ if .ReadingTime }}
  <p class="article_readtime">
    <span class="readtime_tilde">~</span><span class="readtime_minutes">{{ .ReadingTime }}</span> minutes to read
  </p>
  {{ end }}
  <div class="article_text">{{ .Summary }}</div>
</article>
