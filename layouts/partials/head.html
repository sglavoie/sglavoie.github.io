  {{- $meta := partial "seo/page-meta.html" . -}}

  <meta charset="utf-8" />
  <link
    rel="preload"
    href="{{ "/theme/css/fonts/lato-regular.woff2" | relURL }}"
    as="font"
    type="font/woff2"
    crossorigin
  />
  <link
    rel="preload"
    href="{{ "/theme/css/fonts/lato-bold.woff2" | relURL }}"
    as="font"
    type="font/woff2"
    crossorigin
  />
  <link
    rel="preload"
    href="{{ "/theme/css/fonts/ubuntu-regular-webfont.woff2" | relURL }}"
    as="font"
    type="font/woff2"
    crossorigin
  />
  <link
    rel="preload"
    href="{{ "/theme/css/fonts/ubuntu-bold-webfont.woff2" | relURL }}"
    as="font"
    type="font/woff2"
    crossorigin
  />
  <link
    rel="preload"
    href="{{ "/theme/css/fonts/ubuntu-regular-italic-webfont.woff2" | relURL }}"
    as="font"
    type="font/woff2"
    crossorigin
  />
  <link
    rel="preload"
    href="{{ "/theme/css/fonts/ubuntu-bold-italic-webfont.woff2" | relURL }}"
    as="font"
    type="font/woff2"
    crossorigin
  />
  <link
    rel="preload"
    href="{{ "/theme/css/fonts/SourceCodePro-Regular.ttf.woff2" | relURL }}"
    as="font"
    type="font/woff2"
    crossorigin
  />
  <link
    rel="preload"
    href="{{ "/theme/css/fonts/SourceCodePro-Bold.ttf.woff2" | relURL }}"
    as="font"
    type="font/woff2"
    crossorigin
  />
  <link
    rel="preload"
    href="{{ "/theme/css/fonts/SourceCodePro-It.ttf.woff2" | relURL }}"
    as="font"
    type="font/woff2"
    crossorigin
  />
  <link
    rel="preload"
    href="{{ "/theme/css/fonts/SourceCodePro-BoldIt.ttf.woff2" | relURL }}"
    as="font"
    type="font/woff2"
    crossorigin
  />
  <link rel="preload" as="style" href="{{ "/theme/css/main.css" | relURL }}" />
  <link
    rel="stylesheet"
    type="text/css"
    href="{{ "/theme/css/styles.css" | relURL }}"
  />
  <link href="{{ "/theme/css/sweetalert2.css" | relURL }}" rel="stylesheet" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="{{ .Site.Params.author }}" />
  <meta name="description" content="{{ $meta.description }}" />
  {{ with $meta.robots }}
  <meta name="robots" content="{{ . }}" />
  {{ end }}
  <link rel="canonical" href="{{ $meta.canonicalURL }}" />
  <meta property="og:title" content="{{ $meta.title }}" />
  <meta property="og:description" content="{{ $meta.description }}" />
  <meta property="og:url" content="{{ $meta.url }}" />
  <meta property="og:site_name" content="{{ .Site.Title }}" />
  <meta property="og:type" content="{{ $meta.ogType }}" />
  <meta property="og:image" content="{{ $meta.socialImage }}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ $meta.title }}" />
  <meta name="twitter:description" content="{{ $meta.description }}" />
  <meta name="twitter:image" content="{{ $meta.socialImage }}" />

  {{ partial "seo/site-structured-data.html" . }}

  <!-- Agent discovery (RFC 8288 / RFC 9727) -->
  <link rel="api-catalog" href="{{ "/.well-known/api-catalog" | absURL }}" />
  <link rel="describedby" href="{{ "/sitemap.xml" | absURL }}" type="application/xml" />

  <link
    href="{{ "/feeds/sglavoie.rss.xml" | absURL }}"
    type="application/rss+xml"
    rel="alternate"
    title="{{ .Site.Title }} RSS"
  />

  <!-- Favicon -->
  <link
    rel="apple-touch-icon"
    href="{{ "/theme/favicon/apple-touch-icon.png" | relURL }}"
  />
  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="{{ "/theme/favicon/favicon-32x32.png" | relURL }}"
  />
  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="{{ "/theme/favicon/favicon-16x16.png" | relURL }}"
  />
  <link rel="manifest" href="{{ "/theme/favicon/site.webmanifest" | relURL }}" />
  <link
    rel="mask-icon"
    href="{{ "/theme/favicon/safari-pinned-tab.svg" | relURL }}"
    color="#5bbad5"
  />
  <link rel="shortcut icon" href="{{ "/theme/favicon/favicon.ico" | relURL }}" />
  <meta name="msapplication-TileColor" content="#2d89ef" />
  <meta
    name="msapplication-TileImage"
    content="{{ "/theme/favicon/mstile-144x144.png" | relURL }}"
  />
  <meta
    name="msapplication-config"
    content="{{ "/theme/favicon/browserconfig.xml" | relURL }}"
  />
  <meta name="theme-color" content="#232323" />
