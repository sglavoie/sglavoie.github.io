# HUGO_VERSION=0.166.0 (extended) — must match Cloudflare Pages build env

baseURL = "https://www.sglavoie.com/"
locale = "en-US"
title = "sglavoie.com"
defaultContentLanguage = "en"
timeZone = "America/Mexico_City"
enableRobotsTXT = false

[pagination]
  pagerSize = 10

[params]
author = "Sébastien Lavoie"
# Source of the site: posts link to their file to suggest an edit or report
# a problem.
repo = "https://github.com/sglavoie/sglavoie.github.io"
# Posts last updated longer ago than this open with a note that details may
# have changed (partials/age-notice.html).
stale_after_years = 3
intro = "A software developer writing about Go, software design, and the tools and workflows that make programming more enjoyable."
description = "Posts and writings by Sébastien Lavoie. Customization setups and articles on productivity for developers who like minimalism."

# What one term of each taxonomy is called, in page titles and feeds.
[params.term_kinds]
  categories = "Category"
  tags = "Tag"
  series = "Series"

# Shown under the home intro and in the footer.
[[params.intro_links]]
  name = "GitHub"
  url = "https://github.com/sglavoie"
[[params.intro_links]]
  name = "LinkedIn"
  url = "https://www.linkedin.com/in/sglavoie/"
[[params.intro_links]]
  name = "Resume"
  url = "/resume/"
[[params.intro_links]]
  name = "RSS feed"
  url = "/feeds/sglavoie.rss.xml"

# Home page groups after "Start here", in this order. Each shows the newest
# posts of a taxonomy term (taxonomy defaults to "tags") that the page
# hasn't listed above it.
[[params.home_topics]]
  title = "Book summaries"
  term = "books"
  blurb = "Notes on books about Go, software design and engineering careers."
[[params.home_topics]]
  title = "Terminal & tools"
  term = "terminal"
  blurb = "The shell, Git, tmux and the small tools that make the command line pleasant."
[[params.home_topics]]
  title = "Workflow"
  taxonomy = "categories"
  term = "workflow"
  blurb = "Editors, window managers and habits for getting work done with less friction."

[permalinks]
  posts = "/posts/:slug/"

[taxonomies]
  category = "categories"
  tag = "tags"
  # Posts sharing a `series` list each other (partials/series.html) and
  # have a page, oldest first, with its own feed.
  series = "series"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser.attribute]
    block = false
    title = false
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[outputs]
  home = ["HTML", "RSS", "Atom", "JSONFeed", "Headers"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML", "TermFeed"]

[services.rss]
  limit = -1

[outputFormats.RSS]
  baseName = "sglavoie.rss"
  path = "feeds"
  mediaType = "application/rss+xml"

[mediaTypes."application/atom+xml"]
  suffixes = ["xml"]

[outputFormats.Atom]
  baseName = "sglavoie.atom"
  path = "feeds"
  mediaType = "application/atom+xml"
  rel = "alternate"

[mediaTypes."application/feed+json"]
  suffixes = ["json"]

[outputFormats.JSONFeed]
  baseName = "sglavoie"
  path = "feeds"
  mediaType = "application/feed+json"
  rel = "alternate"
  isPlainText = true

# Cloudflare Pages' _headers file, from layouts/index.headers, so the
# Content-Security-Policy can carry the hashes of the inline scripts.
[mediaTypes."text/headers"]
  suffixes = [""]

[outputFormats.Headers]
  baseName = "_headers"
  mediaType = "text/headers"
  isPlainText = true
  notAlternative = true

# One RSS feed per tag and category, at /tags/<term>/feed.xml.
[outputFormats.TermFeed]
  baseName = "feed"
  mediaType = "application/rss+xml"
  rel = "alternate"

# Post images stay in static/ (raw <img> tags and feeds link to them as-is)
# and are also mounted as assets, so partials/responsive-images.html can
# make WebP versions of them. Declaring any mount drops the defaults, hence
# assets and static are listed too.
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"
  [[module.mounts]]
    source = "static"
    target = "static"
