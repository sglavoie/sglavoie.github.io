<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
  <head>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.dataset.theme = theme;
          }
        } catch (e) {}
      })();
    </script>
    {{ partial "head.html" . }}
    {{ block "head" . }}{{ end }}
    <title>{{ .Site.Title }}{{ block "title" . }}{{ end }}</title>
  </head>

  <body>
    {{ partial "header.html" . }}

    <main>
      {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}

    <script src="{{ "/pagefind/pagefind-ui.js" | relURL }}"></script>
    <script src="{{ "/theme/scripts/sweetalert2.min.js" | relURL }}"></script>
    <script>
      const searchTrigger = document.getElementById("search-trigger");

      function focusSearchInput() {
        const searchInput = document.querySelector("#search input");
        if (searchInput) {
          searchInput.focus();
        }
      }

      function bindSearchClearButton() {
        const clearButton = document.querySelector(
          ".pagefind-ui__search-clear",
        );
        if (clearButton && !clearButton.dataset.focusBound) {
          clearButton.dataset.focusBound = "true";
          clearButton.addEventListener("click", focusSearchInput);
        }
      }

      function isEditableTarget(target) {
        return Boolean(
          target &&
            target.closest(
              'input, textarea, select, button, [contenteditable="true"]',
            ),
        );
      }

      function openSearchModal() {
        if (typeof Swal === "undefined" || typeof PagefindUI === "undefined") {
          return;
        }

        if (searchTrigger) {
          searchTrigger.setAttribute("aria-expanded", "true");
        }

        Swal.fire({
          title: "<strong>Search</strong>",
          html: `
    <div id="searchWrapper">
      <div id="search"></div>
    </div>`,
          showCancelButton: false,
          focusConfirm: false,
          didOpen: () => {
            new PagefindUI({
              element: "#search",
              showSubResults: true,
              showImages: false,
              debounceTimeoutMs: 100,
            });
            focusSearchInput();
            window.setTimeout(focusSearchInput, 50);
            window.setTimeout(focusSearchInput, 150);

            // Re-focus on search input when clear button is clicked
            bindSearchClearButton();
            window.setTimeout(bindSearchClearButton, 150);
          },
          width: "100%",
          confirmButtonText: "Close",
          confirmButtonAriaLabel: "Close search dialog",
          position: "top-start",
          willClose: () => {
            if (searchTrigger) {
              searchTrigger.setAttribute("aria-expanded", "false");
            }
          },
          didClose: () => {
            if (searchTrigger) {
              searchTrigger.setAttribute("aria-expanded", "false");
            }
          },
        });
      }

      if (searchTrigger) {
        searchTrigger.setAttribute("aria-expanded", "false");
        searchTrigger.addEventListener("click", function () {
          openSearchModal();
        });
      }

      const themeToggle = document.getElementById("theme-toggle");

      function currentTheme() {
        const explicit = document.documentElement.dataset.theme;
        if (explicit) {
          return explicit;
        }
        return window.matchMedia("(prefers-color-scheme: light)").matches
          ? "light"
          : "dark";
      }

      const themeColors = { dark: "#090f15", light: "#fcfdfe" };

      function syncThemeColor() {
        if (!document.documentElement.dataset.theme) {
          return;
        }
        const color = themeColors[currentTheme()];
        document
          .querySelectorAll('meta[name="theme-color"]')
          .forEach(function (meta) {
            meta.setAttribute("content", color);
          });
      }

      syncThemeColor();

      if (themeToggle) {
        themeToggle.addEventListener("click", function () {
          const next = currentTheme() === "dark" ? "light" : "dark";
          document.documentElement.dataset.theme = next;
          syncThemeColor();
          try {
            localStorage.setItem("theme", next);
          } catch (e) {}
        });
      }

      // Close the Topics menu on outside click or Escape
      const topicsMenu = document.querySelector(".topics-menu");
      if (topicsMenu) {
        document.addEventListener("click", function (e) {
          if (topicsMenu.open && !topicsMenu.contains(e.target)) {
            topicsMenu.open = false;
          }
        });
        topicsMenu.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && topicsMenu.open) {
            topicsMenu.open = false;
            topicsMenu.querySelector("summary").focus();
          }
        });
      }

      // Key press event for the 'F' key
      document.addEventListener("keydown", function (e) {
        const modalIsVisible = typeof Swal !== "undefined" && Swal.isVisible();
        if (
          e.key.toLowerCase() === "f" &&
          !modalIsVisible &&
          !e.metaKey &&
          !e.ctrlKey &&
          !e.altKey &&
          !isEditableTarget(e.target)
        ) {
          e.preventDefault();
          openSearchModal();
        }
      });
    </script>
  </body>
</html>
