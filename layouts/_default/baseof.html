<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
  <head>
    {{ partial "head.html" . }}
    {{ block "head" . }}{{ end }}
    <title>{{ .Site.Title }}{{ block "title" . }}{{ end }}</title>
  </head>

  <body>
    <div id="pageContainer">
      {{ partial "sidebar.html" . }}
      {{ partial "nav.html" . }}

      <!-- Content area -->
      <main>
        {{ block "main" . }}{{ end }}
      </main>
    </div>

    {{ partial "footer.html" . }}

    <script src="{{ "/pagefind/pagefind-ui.js" | relURL }}"></script>
    <script src="{{ "/theme/scripts/sweetalert2.min.js" | relURL }}"></script>
    <script>
      const searchTrigger = document.getElementById("search-trigger");

      function focusSearchInput() {
        const searchInput = document.querySelector("#search input");
        if (searchInput) {
          searchInput.focus();
        }
      }

      function bindSearchClearButton() {
        const clearButton = document.querySelector(
          ".pagefind-ui__search-clear",
        );
        if (clearButton && !clearButton.dataset.focusBound) {
          clearButton.dataset.focusBound = "true";
          clearButton.addEventListener("click", focusSearchInput);
        }
      }

      function isEditableTarget(target) {
        return Boolean(
          target &&
            target.closest(
              'input, textarea, select, button, [contenteditable="true"]',
            ),
        );
      }

      function openSearchModal() {
        if (typeof Swal === "undefined" || typeof PagefindUI === "undefined") {
          return;
        }

        if (searchTrigger) {
          searchTrigger.setAttribute("aria-expanded", "true");
        }

        Swal.fire({
          title: "<strong>Search</strong>",
          html: `
    <div id="searchWrapper">
      <div id="search"></div>
    </div>`,
          showCancelButton: false,
          focusConfirm: false,
          didOpen: () => {
            new PagefindUI({
              element: "#search",
              showSubResults: true,
              showImages: false,
              debounceTimeoutMs: 100,
            });
            focusSearchInput();
            window.setTimeout(focusSearchInput, 50);
            window.setTimeout(focusSearchInput, 150);

            // Re-focus on search input when clear button is clicked
            bindSearchClearButton();
            window.setTimeout(bindSearchClearButton, 150);
          },
          width: "100%",
          confirmButtonText: "Close",
          confirmButtonAriaLabel: "Close search dialog",
          position: "top-start",
          willClose: () => {
            if (searchTrigger) {
              searchTrigger.setAttribute("aria-expanded", "false");
            }
          },
          didClose: () => {
            if (searchTrigger) {
              searchTrigger.setAttribute("aria-expanded", "false");
            }
          },
        });
      }

      if (searchTrigger) {
        searchTrigger.setAttribute("aria-expanded", "false");
        searchTrigger.addEventListener("click", function () {
          openSearchModal();
        });
      }

      // Key press event for the 'F' key
      document.addEventListener("keydown", function (e) {
        const modalIsVisible = typeof Swal !== "undefined" && Swal.isVisible();
        if (
          e.key.toLowerCase() === "f" &&
          !modalIsVisible &&
          !e.metaKey &&
          !e.ctrlKey &&
          !e.altKey &&
          !isEditableTarget(e.target)
        ) {
          e.preventDefault();
          openSearchModal();
        }
      });
    </script>
  </body>
</html>
